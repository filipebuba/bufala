name: Test CI/CD Setup
'on':
  push:
    branches:
    - main
    - develop
  workflow_dispatch: {}

jobs:
  backend-smoke-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run backend P0 smoke tests
      run: pytest backend/tests/test_p0_endpoints.py -q
